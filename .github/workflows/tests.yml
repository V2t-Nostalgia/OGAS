name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux packet and Qt import dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libnetfilter-queue-dev libegl1 libopengl0
      - name: Install project and validation tools
        run: python -m pip install --disable-pip-version-check -e ".[overlay]" "ruff>=0.12,<1"
      - name: Install SDK recovery test dependencies
        run: python -m pip install --disable-pip-version-check -r services/stellaris_native_runtime/tools/sdk_recovery/requirements.txt
      - name: Compile Python
        run: >-
          python -m compileall -q src apps scripts
          services/stellaris_native_runtime/research/observe_dashboard
          services/stellaris_native_runtime/tools/sdk_recovery
      - name: Build Stellaris native runtime
        if: runner.os == 'Linux'
        run: >-
          cmake -S services/stellaris_native_runtime
          -B build/stellaris_native_runtime
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DIAG_NATIVE_RUNTIME_BUILD_TESTS=ON &&
          cmake --build build/stellaris_native_runtime --parallel 4 &&
          ctest --test-dir build/stellaris_native_runtime --output-on-failure &&
          cmake -S services/stellaris_native_runtime/research
          -B build/stellaris_native_runtime/research
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DIAG_STELLARIS_RESEARCH_BUILD_TESTS=ON &&
          cmake --build build/stellaris_native_runtime/research --parallel 4 &&
          ctest --test-dir build/stellaris_native_runtime/research --output-on-failure
      - name: Build Stellaris native runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/build/Build-StellarisNativeRuntime.ps1
          -OutputRoot ./build/stellaris_native_runtime/ci-dist
      - name: Run repository tests
        run: python scripts/validation/run_tests.py --quiet
      - name: Check fatal Python diagnostics
        run: >-
          ruff check --select E9,F src apps scripts
          services/stellaris_native_runtime/research/observe_dashboard
          services/stellaris_native_runtime/research/long_run_capture.py
          services/stellaris_native_runtime/research/test_observe_dashboard.py
      - name: Check browser JavaScript
        run: >-
          node --check apps/control_center/web/app.js &&
          node --check apps/control_center/web/app_v2.js &&
          node --check services/stellaris_native_runtime/research/observe_dashboard/web/app.js
