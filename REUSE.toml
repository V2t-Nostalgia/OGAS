version = 1
SPDX-PackageName = "OGAS"
SPDX-PackageSupplier = "OGAS contributors"
SPDX-PackageDownloadLocation = "https://github.com/V2t-Nostalgia/OGAS"

[[annotations]]
path = ["**/*.json", "**/*.yml", "**/*.yaml", "**/*.mod", "common/**", "events/**", "localisation/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Imperial Auto Governor contributors"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = ["**/*.md", "NOTICE", "ORIGIN.md", "TRADEMARKS.md", "SECURITY.md", "CONTRIBUTING.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Imperial Auto Governor contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["services/stellaris_native_runtime/tools/sdk_recovery/vendor/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Yidhar"
SPDX-License-Identifier = "MIT"
